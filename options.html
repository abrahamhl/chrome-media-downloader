<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ajustes de Galería</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #1e1e1e; color: #fff; padding: 30px; display: flex; flex-direction: column; align-items: center; }
        .container { background: #2d2d2d; padding: 30px; border-radius: 10px; width: 400px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        #recordArea { background: #111; border: 2px dashed #e74c3c; padding: 40px 20px; border-radius: 8px; cursor: crosshair; user-select: none; margin: 20px 0; font-size: 14px; color: #aaa; transition: 0.2s; }
        #recordArea:hover { border-color: #3498db; color: #fff; }
        #recordArea.recording { background: #e74c3c; color: #fff; border-style: solid; }
        .current-combo { font-size: 18px; font-weight: bold; color: #f1c40f; margin-bottom: 20px; }
        button { background: #3498db; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Configura tu Combinación</h2>
        <p>Tu atajo actual es:</p>
        <div id="currentDisplay" class="current-combo">Cargando...</div>

        <div id="recordArea" tabindex="0">
            Haz clic en este recuadro usando la combinación de teclas + botón del ratón que quieras grabar.
        </div>

        <button id="saveBtn">Guardar Combinación</button>
    </div>
    <script src="options.js"></script>
</body>
</html>
